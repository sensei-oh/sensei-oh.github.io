<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GreenConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap">
  <style>
    :root {
      --forest: #01472e;
      --sage: #ccd5ae;
      --olive: #e9edc9;
      --cream: #fefae0;
      --moss: #a3b18a;

      --page-bg: #fefae0;
      --surface: rgba(254, 250, 224, 0.66);
      --surface-hover: rgba(233, 237, 201, 0.78);
      --nav-bg: rgba(233, 237, 201, 0.65);
      --ink: #01472e;
      --heading-ink: #01472e;
      --border: rgba(1, 71, 46, 0.18);
      --shader-opacity: 0.22;
      --shadow-forest: 0 25px 50px -12px rgba(1, 71, 46, 0.2);
      --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);

      /* EcoBot Light Theme */
      --bot-bg: rgba(254, 250, 224, 0.92);
      --bot-surface: rgba(233, 237, 201, 0.9);
      --bot-ink: #01472e;
      --bot-accent: #01472e;
      --bot-accent-ink: #fefae0;

      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    :root[data-theme="dark"] {
      --page-bg: #030c08;
      --surface: rgba(6, 26, 18, 0.72);
      --surface-hover: rgba(1, 71, 46, 0.85);
      --nav-bg: rgba(6, 26, 18, 0.76);
      --ink: #fefae0;
      --heading-ink: #fefae0;
      --border: rgba(163, 177, 138, 0.3);
      --shader-opacity: 0.28;
      --shadow-forest: 0 25px 50px -12px rgba(0, 0, 0, 0.6);

      /* EcoBot Dark Theme */
      --bot-bg: rgba(1, 71, 46, 0.95);
      --bot-surface: rgba(2, 89, 58, 0.92);
      --bot-ink: #fefae0;
      --bot-accent: #ccd5ae;
      --bot-accent-ink: #01472e;

      color-scheme: dark;
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--ink);
      font: 400 16px/1.6 "Inter", system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.45s ease, color 0.35s ease;
    }

    #bg-shader {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: var(--page-bg);
      transition: background 0.45s ease;
    }

    #bg-shader canvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: var(--shader-opacity);
      transition: opacity 0.45s ease;
    }

    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99998;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    @keyframes revealUp {
      from { opacity: 0; transform: translateY(100px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .reveal { animation: revealUp 1.2s var(--ease-snappy) both; }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px 140px;
      position: relative;
      z-index: 1;
    }

    .hero-section {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 5rem;
      padding: clamp(2.2rem, 5vw, 4.5rem) clamp(1.5rem, 4vw, 3.5rem);
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-forest);
      overflow: hidden;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .hero-eyebrow {
      display: inline-block;
      font: 700 0.72rem/1 "Inter", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--forest);
      background: var(--sage);
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
    }

    .theme-toggle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--forest);
      color: var(--cream);
      border: 1.5px solid var(--sage);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--shadow-forest);
      transition: transform 0.35s var(--ease-snappy), background 0.3s ease, color 0.3s ease;
    }

    :root[data-theme="dark"] .theme-toggle {
      background: var(--sage);
      color: var(--forest);
      border-color: var(--cream);
    }

    .theme-toggle:hover {
      transform: scale(1.08) rotate(12deg);
    }

    header h1 {
      font: 400 clamp(2.2rem, 8.8vw, 7rem)/0.85 "Anton", sans-serif;
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-transform: uppercase;
      margin: 0 0 1.5rem;
    }

    header p {
      max-width: 620px;
      font-size: 1.05rem;
      margin: 0;
      opacity: 0.9;
    }

    .floating-emblem {
      position: absolute;
      bottom: 2.5rem;
      right: 3rem;
      width: clamp(68px, 8vw, 110px);
      height: clamp(68px, 8vw, 110px);
      border-radius: 2.5rem;
      background: var(--forest);
      color: var(--cream);
      border: 1px solid var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-forest);
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }

    @media (max-width: 780px) {
      .hero-section { border-radius: 3rem; }
      .floating-emblem { display: none; }
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0 0 2.5rem;
      padding: 10px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 5rem;
      box-shadow: var(--shadow-forest);
    }

    nav button {
      flex: 1;
      min-width: 160px;
      background: transparent;
      border: 0;
      border-radius: 5rem;
      padding: 16px 20px;
      font: 700 0.78rem/1 "Inter", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.35s var(--ease-snappy);
    }

    nav button:hover { background: rgba(163, 177, 138, 0.28); }
    nav button[aria-selected="true"] {
      background: var(--forest);
      color: var(--cream);
      box-shadow: var(--shadow-forest);
    }

    :root[data-theme="dark"] nav button[aria-selected="true"] {
      background: var(--sage);
      color: var(--forest);
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--moss);
      outline-offset: 3px;
    }

    .section-heading {
      font: 400 clamp(3.5rem, 15vw, 11rem)/0.82 "Anton", sans-serif;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--heading-ink);
      margin: 0 0 1.75rem;
      transition: color 0.35s ease;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 2rem;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      border-radius: 999px;
      padding: 12px 22px;
      font: 700 0.72rem/1 "Inter", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: all 0.35s var(--ease-snappy);
    }

    .chip:hover { background: var(--sage); color: var(--forest); transform: translateY(-2px); }
    .chip[aria-pressed="true"] {
      background: var(--forest);
      color: var(--cream);
      border-color: var(--forest);
      box-shadow: var(--shadow-forest);
    }

    :root[data-theme="dark"] .chip[aria-pressed="true"] {
      background: var(--sage);
      color: var(--forest);
      border-color: var(--sage);
    }

    .loc {
      margin-left: auto;
      border: 1.5px solid var(--ink);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 2.5rem;
      padding: 2rem;
      box-shadow: var(--shadow-forest);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.5s var(--ease-snappy), background 0.35s ease;
      animation: revealUp 1.2s var(--ease-snappy) both;
    }

    .card:hover { transform: translateY(-6px); background: var(--surface-hover); }

    .card h3 {
      font: 400 2.2rem/0.95 "Anton", sans-serif;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0.85rem 0 0.5rem;
    }

    .meta {
      opacity: 0.78;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin: 0.25rem 0 0.75rem;
    }

    .card p:not(.meta) { margin: 0 0 1.5rem; font-size: 0.96rem; }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .tag {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      background: var(--sage);
      color: var(--forest);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .btn {
      background: var(--forest);
      color: var(--cream);
      border: 1.5px solid var(--forest);
      border-radius: 999px;
      padding: 14px 24px;
      font: 700 0.74rem/1 "Inter", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      cursor: pointer;
      transition: all 0.35s var(--ease-snappy);
    }

    :root[data-theme="dark"] .btn {
      background: var(--sage);
      color: var(--forest);
      border-color: var(--sage);
    }

    .btn:hover { background: var(--moss); border-color: var(--moss); color: var(--forest); transform: translateY(-2px); }
    .btn.alt { background: transparent; color: var(--ink); border-color: var(--ink); }
    .btn.alt:hover { background: var(--sage); color: var(--forest); border-color: var(--sage); }

    .score {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 2rem;
    }

    .score div {
      flex: 1;
      min-width: 220px;
      background: var(--forest);
      color: var(--cream);
      border: 1px solid var(--border);
      border-radius: 2.5rem;
      padding: 2rem;
      box-shadow: var(--shadow-forest);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      animation: revealUp 1.2s var(--ease-snappy) both;
    }

    .score b {
      font: 400 4.5rem/0.9 "Anton", sans-serif;
      letter-spacing: -0.03em;
      color: var(--sage);
      display: block;
      margin-bottom: 0.5rem;
    }

    .empty {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 2.5rem;
      text-align: center;
      padding: 3.5rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      box-shadow: var(--shadow-forest);
      grid-column: 1 / -1;
    }

    /* EcoBot Chat Widget */
    #gc-chat-container {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 24px;
      z-index: 99999;
      color: var(--bot-ink);
    }

    #gc-chat-toggle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--forest);
      border: 2px solid var(--sage);
      color: var(--cream);
      cursor: pointer;
      box-shadow: var(--shadow-forest);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s var(--ease-snappy), background 0.3s ease;
      margin-left: auto;
    }

    #gc-chat-toggle:hover { background: #02593a; transform: scale(1.06); }

    #gc-chat-window {
      width: 370px;
      max-width: calc(100vw - 32px);
      height: 510px;
      max-height: calc(100vh - 110px);
      background: var(--bot-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid var(--moss);
      border-radius: 2.5rem;
      box-shadow: var(--shadow-forest);
      display: none;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 16px;
      animation: gcSlideUp 0.5s var(--ease-snappy);
    }

    #gc-chat-window.gc-open { display: flex; }
    @keyframes gcSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .gc-chat-header {
      background: var(--bot-surface);
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gc-chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .gc-status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    #gc-chat-close { background: none; border: none; color: var(--bot-ink); opacity: 0.7; font-size: 22px; cursor: pointer; line-height: 1; padding: 4px; }
    #gc-chat-close:hover { opacity: 1; }

    #gc-chat-messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--moss) transparent;
    }

    .gc-msg { max-width: 85%; padding: 12px 16px; border-radius: 1.5rem; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; }
    .gc-msg-bot { background: var(--bot-surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 0.4rem; }
    .gc-msg-user { background: var(--bot-accent); color: var(--bot-accent-ink); font-weight: 700; align-self: flex-end; border-bottom-right-radius: 0.4rem; }

    .gc-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
    .gc-chip {
      background: var(--bot-surface);
      border: 1px solid var(--moss);
      color: var(--bot-ink);
      font: 700 10px/1 "Inter", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .gc-chip:hover { background: var(--bot-accent); color: var(--bot-accent-ink); border-color: var(--bot-accent); }

    #gc-chat-form { display: flex; padding: 14px 18px; background: var(--bot-surface); border-top: 1px solid var(--border); gap: 8px; }
    #gc-chat-input { flex: 1; background: var(--bot-bg); border: 1px solid var(--moss); border-radius: 999px; padding: 10px 16px; color: var(--bot-ink); font-size: 13px; outline: none; }
    #gc-chat-input::placeholder { color: var(--bot-ink); opacity: 0.5; }
    #gc-chat-input:focus { border-color: var(--forest); }
    #gc-chat-send { background: var(--bot-accent); border: none; border-radius: 999px; color: var(--bot-accent-ink); padding: 0 18px; font: 700 11px/1 "Inter", sans-serif; text-transform: uppercase; letter-spacing: 0.22em; cursor: pointer; transition: opacity 0.2s ease; }
    #gc-chat-send:hover { opacity: 0.88; }
  </style>
  <style>
  @media (max-width: 640px) {
    header h1 {
      font-size: clamp(1.75rem, 8.2vw, 3.2rem);
    }
    nav {
      border-radius: 2rem;
    }
    nav button {
      min-width: 120px;
      padding: 14px 12px;
      letter-spacing: 0.18em;
    }
    .cards-grid {
      grid-template-columns: 1fr;
    }
    .loc {
      margin-left: 0;
      width: 100%;
      text-align: center;
    }
    #gc-chat-container {
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    #gc-chat-window {
      width: calc(100vw - 32px);
      max-height: calc(100dvh - 100px);
    }
    #gc-chat-input {
      font-size: 16px;
    }
  }
</style>
</head>
<body>
  <div id="bg-shader" aria-hidden="true"></div>
  <div class="noise-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <section class="hero-section reveal">
      <div class="hero-top">
        <span class="hero-eyebrow">DISCOVER · JOIN · TRACK</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch color theme" title="Switch color theme"></button>
      </div>
      <div class="floating-emblem" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
        </svg>
      </div>
      <header>
        <h1>GreenConnect</h1>
        <p>Find a cleanup, recycling drive or plantation near you, join it, and keep a record of what you’ve done.</p>
      </header>
    </section>

    <nav role="tablist" class="reveal" style="animation-delay:0.1s">
      <button role="tab" data-t="events" aria-selected="true">Events</button>
      <button role="tab" data-t="mine" aria-selected="false">My participation</button>
      <button role="tab" data-t="tips" aria-selected="false">Tips</button>
    </nav>

    <main id="view"></main>
  </div>

  <div id="gc-chat-container">
    <div id="gc-chat-window">
      <div class="gc-chat-header">
        <div class="gc-chat-title"><span class="gc-status-dot"></span><span>EcoBot</span></div>
        <button id="gc-chat-close" aria-label="Close chat">&times;</button>
      </div>
      <div id="gc-chat-messages">
        <div class="gc-msg gc-msg-bot">Hi! Welcome to <b>GreenConnect</b>. Ask me about upcoming events near you, how to register, eco tips, or how this platform works!</div>
      </div>
      <div class="gc-chips">
        <button type="button" class="gc-chip" data-q="What are events near me?">Events Near Me</button>
        <button type="button" class="gc-chip" data-q="How do I register for a drive?">How to Join</button>
        <button type="button" class="gc-chip" data-q="Give me an eco tip">Eco Tips</button>
        <button type="button" class="gc-chip" data-q="What is GreenConnect?">About Project</button>
      </div>
      <form id="gc-chat-form">
        <input type="text" id="gc-chat-input" placeholder="Ask something..." autocomplete="off" required />
        <button type="submit" id="gc-chat-send">Send</button>
      </form>
    </div>
    <button id="gc-chat-toggle" aria-label="Open chat">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script>
    /* Theme Toggle with Sun / Moon Icons */
    (() => {
      const root = document.documentElement;
      const btn = document.getElementById("theme-toggle");
      const SUN_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
      const MOON_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

      const saved = localStorage.getItem("gc-theme");
      const initial = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

      const apply = mode => {
        root.dataset.theme = mode;
        const isDark = mode === "dark";
        btn.innerHTML = isDark ? SUN_ICON : MOON_ICON;
        btn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        btn.setAttribute("title", isDark ? "Switch to light mode" : "Switch to dark mode");
        try { localStorage.setItem("gc-theme", mode); } catch {}
      };

      apply(initial);
      btn.onclick = () => apply(root.dataset.theme === "dark" ? "light" : "dark");
    })();

    /* App State & Rendering */
    const EVENTS = [
      { id: 1, title: "Beach cleanliness drive", cat: "Cleanliness", place: "Bhayandar Creek Shore", lat: 19.31, lon: 72.85, d: 3, desc: "Gloves and bags provided. Two hours of cleanup followed by waste segregation." },
      { id: 2, title: "Plant 100 saplings", cat: "Plantation", place: "Mira Road Hillside", lat: 19.28, lon: 72.88, d: 6, desc: "Native saplings, digging tools and water provided. Wear shoes you can get muddy." },
      { id: 3, title: "E-waste and plastic collection", cat: "Recycling", place: "Shree L. R. Tiwari College campus", lat: 19.285, lon: 72.868, d: 9, desc: "Bring old chargers, batteries and clean plastic. Items go to an authorised recycler." },
      { id: 4, title: "Lake-side cleanup", cat: "Cleanliness", place: "Local lake garden", lat: 19.3, lon: 72.86, d: 12, desc: "Remove litter around the walking path. Refreshments for all volunteers." },
      { id: 5, title: "Compost workshop", cat: "Recycling", place: "Community hall, Bhayandar East", lat: 19.302, lon: 72.855, d: 15, desc: "Learn to turn kitchen waste into compost at home." },
      { id: 6, title: "Tree care day", cat: "Plantation", place: "Station Road avenue", lat: 19.29, lon: 72.87, d: 18, desc: "Water, mulch and protect young trees along the road." }
    ].map(e => ({ ...e, when: new Date(Date.now() + e.d * 86400000) }));

    const TIPS = [
      "Carry a cloth bag. One bag used for years replaces hundreds of plastic ones.",
      "Segregate waste into wet and dry at home. Recyclers can only use clean, dry material.",
      "Switch off lights and fans when you leave a room.",
      "Water saplings in the evening so less water evaporates.",
      "Take an old charger or battery to an e-waste drive instead of throwing it away.",
      "Refill a bottle instead of buying a new one."
    ];

    let tab = "events", cat = "All", pos = null, reg = {};
    try { reg = JSON.parse(localStorage.getItem("gc-reg") || "{}"); } catch {}
    const save = () => { try { localStorage.setItem("gc-reg", JSON.stringify(reg)); } catch {} };
    const fmt = d => d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });

    function km(a, b, c, d) {
      const r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
      return 12742 * Math.asin(Math.sqrt(Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2));
    }

    function card(e, mine, idx) {
      const dist = pos ? ` · ${km(pos.lat, pos.lon, e.lat, e.lon).toFixed(1)} km away` : "";
      const r = reg[e.id];
      const btn = !r
        ? `<button class="btn" data-reg="${e.id}">Register</button>`
        : mine
          ? (r.att ? `<span class="tag">Attended</span>` : `<button class="btn" data-att="${e.id}">Mark attended</button> <button class="btn alt" data-reg="${e.id}">Cancel</button>`)
          : `<button class="btn alt" data-reg="${e.id}">Registered · Cancel</button>`;
      return `<article class="card" style="animation-delay:${Math.min(idx * 0.08, 0.4)}s"><div><span class="tag">${e.cat}</span><h3>${e.title}</h3><p class="meta">${fmt(e.when)} · ${e.place}${dist}</p><p>${e.desc}</p></div><div class="row">${btn}</div></article>`;
    }

    function render() {
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === tab));
      const view = document.getElementById("view");
      if (tab === "events") {
        let list = EVENTS.filter(e => cat === "All" || e.cat === cat);
        if (pos) list = [...list].sort((a, b) => km(pos.lat, pos.lon, a.lat, a.lon) - km(pos.lat, pos.lon, b.lat, b.lon));
        const chips = ["All", "Cleanliness", "Recycling", "Plantation"].map(c => `<button class="chip" aria-pressed="${c === cat}" data-cat="${c}">${c}</button>`).join("");
        const cards = list.map((e, i) => card(e, false, i)).join("") || `<p class="empty">No events in this category yet.</p>`;
        view.innerHTML = `<h2 class="section-heading reveal">Drives</h2><div class="bar reveal">${chips}<button class="chip loc" id="loc">${pos ? "Sorted by distance" : "Show nearest first"}</button></div><div class="cards-grid">${cards}</div>`;
      } else if (tab === "mine") {
        const mine = EVENTS.filter(e => reg[e.id]);
        const att = mine.filter(e => reg[e.id].att).length;
        const cards = mine.map((e, i) => card(e, true, i)).join("") || `<p class="empty">You haven’t registered for anything yet. Open Events and pick one.</p>`;
        view.innerHTML = `<h2 class="section-heading reveal">Record</h2><div class="score"><div><b>${mine.length}</b>Registered</div><div style="animation-delay:0.1s"><b>${att}</b>Attended</div></div><div class="cards-grid">${cards}</div>`;
      } else {
        view.innerHTML = `<h2 class="section-heading reveal">Eco Tips</h2><div class="cards-grid">${TIPS.map((t, i) => `<article class="card" style="animation-delay:${Math.min(i * 0.08, 0.4)}s"><span class="tag">Habit 0${i + 1}</span><p style="margin:1.25rem 0 0;font-size:1.05rem">${t}</p></article>`).join("")}</div>`;
      }
    }

    document.addEventListener("click", ev => {
      const t = ev.target.closest("[data-t],[data-cat],[data-reg],[data-att],#loc");
      if (!t) return;
      if (t.dataset.t) tab = t.dataset.t;
      else if (t.dataset.cat) cat = t.dataset.cat;
      else if (t.dataset.reg) { reg[t.dataset.reg] ? delete reg[t.dataset.reg] : (reg[t.dataset.reg] = { att: false }); save(); }
      else if (t.dataset.att) { reg[t.dataset.att].att = true; save(); }
      else if (t.id === "loc") {
        if (!navigator.geolocation) return alert("Location isn’t available in this browser.");
        return navigator.geolocation.getCurrentPosition(p => { pos = { lat: p.coords.latitude, lon: p.coords.longitude }; render(); }, () => alert("Location permission was denied. Events stay in date order."));
      }
      render();
    });
    render();

    /* EcoBot Assistant */
    (() => {
      const kb = [
        { q: "What are events near me? Upcoming local drives activities schedule", tags: ["near me", "events", "upcoming", "local", "drives", "find", "happening", "where", "when", "location", "bhayandar", "mira road"], a: () => "Here are the upcoming local drives:<br>" + EVENTS.map(e => `• <b>${e.title}</b> (${fmt(e.when)}) at ${e.place}`).join("<br>") + "<br><br>Tap <b>Show nearest first</b> on the Events tab to sort them by distance!" },
        { q: "How do I register or sign up to join an event? Volunteer participation", tags: ["register", "sign up", "join", "volunteer", "how to", "participate", "attend", "rsvp"], a: "Open the <b>Events</b> tab, pick an activity you like, and tap <b>Register</b>. You can track or mark your attendance anytime under <b>My participation</b>!" },
        { q: "How does participation tracking work? Attendance record badges points", tags: ["record", "track", "attendance", "history", "badges", "points", "certificate", "recognition", "my participation"], a: "Your registered drives are saved in the <b>My participation</b> tab, where you can view your registered count and tap <b>Mark attended</b> once you complete an activity." },
        { q: "Give me an environmental awareness tip! Eco tips sustainability habits", tags: ["tip", "tips", "advice", "eco", "green", "save", "recycle", "plastic", "habit", "awareness"], a: () => `<b>Eco Tip:</b> ${TIPS[Math.floor(Math.random() * TIPS.length)]}` },
        { q: "Can I organize or list an event on GreenConnect? Organiser submit", tags: ["organize", "organiser", "host", "add event", "post", "create", "submit", "community group"], a: "GreenConnect brings local community drives together in one central place instead of scattered posters and social media posts." },
        { q: "Is GreenConnect free to use? Cost students residents", tags: ["free", "cost", "price", "pay", "fee", "who can join", "students", "residents"], a: "Yes, GreenConnect is completely free and built to make environmental activities accessible to both students and local residents." },
        { q: "What is GreenConnect? About the platform overview abstract introduction", tags: ["what", "greenconnect", "about", "platform", "overview", "abstract", "project", "purpose"], a: "<b>GreenConnect</b> is a digital platform designed to encourage community participation in environmental activities by centralizing event details, registration, participation records, and awareness tips." },
        { q: "What problem does GreenConnect solve? Why was it built?", tags: ["problem", "why", "issue", "barrier", "challenge", "low participation"], a: "It solves <b>low community participation</b> in environmental drives caused by low awareness, scattered event details across posters and social media, and unclear registration steps." },
        { q: "What technologies and tech stack are used to build GreenConnect?", tags: ["tech", "stack", "technologies", "html", "css", "javascript", "firebase", "database", "built with"], a: "GreenConnect is built with <b>HTML</b>, <b>CSS</b>, and <b>JavaScript</b>, with optional <b>Firebase</b> support and a client-side <b>Fuse.js</b> assistant." },
        { q: "Who created GreenConnect? Developer student college course", tags: ["who", "creator", "developer", "author", "janit", "sarvaiya", "college", "tiwari", "idea lab"], a: "Created by <b>Janit Sarvaiya</b> (Roll No. 35), Department of Computer Engineering at <b>Shree L. R. Tiwari College of Engineering</b>, for <b>IDEA LAB-I</b> (Course Code: 12122110) under the theme <i>Environment: Digital Empowerment for All</i>." },
        { q: "What research or references support GreenConnect? UNEP Principle 10 SDG", tags: ["references", "research", "literature", "unep", "principle 10", "sdg", "sustainable"], a: "Supported by <b>UNEP Principle 10</b> (public access to environmental information and participation) and the <b>UN Sustainable Development Goals (SDGs)</b>." }
      ];
      const fuse = new Fuse(kb, { keys: [{ name: "q", weight: 0.6 }, { name: "tags", weight: 0.4 }], threshold: 0.45, includeScore: true });
      const win = document.getElementById("gc-chat-window"), msgs = document.getElementById("gc-chat-messages"), inp = document.getElementById("gc-chat-input");

      document.getElementById("gc-chat-toggle").onclick = () => { win.classList.toggle("gc-open"); if (win.classList.contains("gc-open")) inp.focus(); };
      document.getElementById("gc-chat-close").onclick = () => win.classList.remove("gc-open");

      const addMsg = (txt, who) => {
        const d = document.createElement("div");
        d.className = `gc-msg gc-msg-${who}`;
        who === "user" ? (d.textContent = txt) : (d.innerHTML = txt);
        msgs.appendChild(d);
        msgs.scrollTop = msgs.scrollHeight;
      };

      const send = text => {
        if (!text.trim()) return;
        addMsg(text, "user");
        inp.value = "";
        setTimeout(() => {
          const clean = text.trim().toLowerCase();
          if (/^(hi|hello|hey|yo|sup|greetings)\b/.test(clean)) return addMsg("Hey there! Ask me about <b>events near you</b>, <b>how to register</b>, <b>eco tips</b>, or <b>what GreenConnect is</b>.", "bot");
          const res = fuse.search(clean);
          const ans = res.length && res[0].score <= 0.5 ? res[0].item.a : "I'm not sure about that yet! Try asking about <b>events near you</b>, <b>how to join</b>, <b>eco tips</b>, or <b>project details</b>.";
          addMsg(typeof ans === "function" ? ans() : ans, "bot");
        }, 200);
      };

      document.getElementById("gc-chat-form").onsubmit = e => { e.preventDefault(); send(inp.value); };
      document.querySelectorAll(".gc-chip").forEach(c => c.onclick = () => send(c.dataset.q));
    })();

    /* Streamlined Wayglim Halo-Path WebGL Background (Transparent Alpha) */
    (() => {
      const host = document.getElementById("bg-shader");
      const canvas = document.createElement("canvas");
      host.appendChild(canvas);
      const gl = canvas.getContext("webgl2", { alpha: true, antialias: false, depth: false, stencil: false, premultipliedAlpha: true });
      if (!gl) return;

      const VS = `#version 300 es
        in vec2 aPos;
        void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

      const FS = `#version 300 es
        precision highp float;
        uniform vec3 iResolution;
        uniform vec2 uViewOffset;
        uniform float iTime;
        uniform vec4 uPath[24];
        out vec4 fragColor;

        vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i = floor(v + dot(v, C.yy)), x0 = v - i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod(i, 289.0);
          vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
          vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
          m = m * m * m * m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0, h = abs(x) - 0.5, ox = floor(x + 0.5), a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
          vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        vec2 pathPt(int i) {
          vec4 q = uPath[i / 2];
          return ((i % 2 == 0 ? q.xy : q.zw) * 2.0 - 1.0) * vec2(1.0, -1.0) * iResolution.xy / min(iResolution.x, iResolution.y);
        }

        vec2 pathUv(vec2 p) {
          vec2 a = pathPt(0);
          float m = 1e9, run = 0.0, wsum = 0.0, asum = 0.0, xsum = 0.0;
          for (int i = 1; i < 48; i++) {
            vec2 b = pathPt(i), ba = b - a, pa = p - a;
            float len = max(length(ba), 1e-5), h = clamp(dot(pa, ba) / (len * len), 0.0, 1.0), d = length(pa - ba * h);
            if (d < m) { float k = exp((d - m) * 8.0); wsum *= k; asum *= k; xsum *= k; m = d; }
            float w = exp((m - d) * 8.0);
            wsum += w; asum += w * (run + h * len); xsum += w * (ba.x * pa.y - ba.y * pa.x) / len; run += len; a = b;
          }
          float along = asum / wsum - 0.5 * run;
          return vec2(sqrt(along * along + 0.36), xsum / wsum);
        }

        void main() {
          vec2 fc = gl_FragCoord.xy + uViewOffset;
          vec2 uv = pathUv((2.0 * fc - iResolution.xy) / min(iResolution.x, iResolution.y)) * 1.55;
          vec3 rd = normalize(vec3(uv, 1.0)), acc = vec3(0.0);
          float dist = 0.0, sheetW = 0.0;
          const vec3 pBase = vec3(0.73135, 1.5686, 1.4019);
          const vec3 pAmp = vec3(0.37088, 0.3764, 0.35615);
          const vec3 pAmp2 = vec3(0.23725, 0.1882, -0.2309);
          const vec3 pPhase = vec3(2.7964, 1.5708, -0.3601);
          const float pShift = -3.14159265;

          for (int i = 0; i < 38; i++) {
            vec3 pos = rd * dist; pos.z -= 2.0;
            float wt = iTime * 0.5;
            float wh = (sin(pos.x * 3.9 + wt) * 0.0341 + sin(pos.z * 0.4 - wt * 0.6) * -0.16333 + sin(-0.7 * pos.x + 0.7 * pos.z + wt * 1.6) * 0.16333) * 4.85714;
            float dw = abs(pos.y - wh), dwr = abs(pos.y - (wh - 0.0168)), dwb = abs(pos.y - (wh + 0.0168));
            if (dist > 0.7) { float sb = 0.15 / (dw * dw + 0.01); sheetW += sb * sb; }
            pos /= 20.0;
            float stepSz = min(dw - 0.08, 0.0) + 0.1138;
            dist += stepSz;
            if (dist >= 36.5) break;
            float pat = smoothstep(0.262, 0.854, sin(pos.x + cos(pos.y) * cos(pos.z)) * sin(pos.z + sin(pos.y) * cos(pos.x + iTime)));
            pat = mix(pat, 0.78, 0.49);
            vec3 ch = vec3(mix(pat, 1.0, 0.15 / (dwr * dwr + 0.01)), mix(pat, 1.0, 0.15 / (dw * dw + 0.01)), mix(pat, 1.0, 0.15 / (dwb * dwb + 0.01)));
            float ang = dist * 3.72414 + pShift;
            vec3 pal = max(pBase + pAmp * cos(ang + pPhase) + pAmp2 * cos(2.0 * ang), vec3(0.0));
            acc += (0.005929 / (2.26996 + stepSz)) * ch * smoothstep(36.5, 7.3, dist) * pal;
          }

          vec3 light = acc;
          float peak = max(light.r, max(light.g, light.b));
          float area = smoothstep(0.14, 0.65, peak);
          if (area > 0.0) {
            float dp = iTime * 0.1;
            vec2 guv = fc * (720.0 / max(min(iResolution.x, iResolution.y), 1.0)) * 2.208 + vec2(cos(dp), sin(dp)) * 33.6;
            float sh = clamp(0.125 + 0.25 * (snoise(guv * 0.5) * snoise(guv * 0.2) + 0.5) + 0.7 * clamp(0.75 * snoise(guv * 0.5), 0.0, 1.0), 0.0, 1.0);
            float op = clamp(smoothstep(0.0, 0.5, clamp(sh * 4.0, 0.0, 1.0)) * area * pow(clamp(1.0 - exp(-0.035 * sheetW), 0.0, 1.0), 0.75) * 1.55, 0.0, 1.0);
            float mixer = sh * 3.0;
            float a0 = pShift + 3.14159265;
            vec3 g = clamp(0.5 * (pBase + pAmp * cos(a0 + pPhase) + pAmp2 * cos(2.0 * a0)), 0.0, 1.0);
            for (int s = 0; s < 3; s++) {
              float as = a0 + float(s + 1) * 1.57079633;
              vec3 gs = clamp(0.5 * (pBase + pAmp * cos(as + pPhase) + pAmp2 * cos(2.0 * as)), 0.0, 1.0);
              g = mix(g, gs, smoothstep(0.25, 0.75, clamp(mixer - float(s), 0.0, 1.0)));
            }
            light += (vec3(1.0) - clamp(light, 0.0, 1.0)) * (g * op);
          }

          float lum = dot(light, vec3(0.2125, 0.7154, 0.0721));
          light = mix(vec3(lum), light, 0.67784) * vec3(1.23285, 1.08673, 0.75891);
          float l = clamp(max(light.r, max(light.g, light.b)), 0.0, 1.0);
          float a = mix(l, l * l * (3.0 - 2.0 * l), 0.5);
          fragColor = vec4(clamp(light * a, 0.0, 1.0), a);
        }`;

      const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      const path = new Float32Array([-0.06,0.9,-0.0322,0.8995,-0.0045,0.8993,0.0233,0.8991,0.0511,0.8986,0.0789,0.8977,0.1066,0.896,0.1344,0.8931,0.162,0.8886,0.1895,0.8818,0.2168,0.8722,0.2437,0.8599,0.2701,0.8449,0.296,0.827,0.3211,0.8059,0.3452,0.7815,0.3681,0.7535,0.3893,0.7217,0.4086,0.6861,0.426,0.6476,0.4419,0.6072,0.4571,0.5658,0.4721,0.5243,0.4874,0.483,0.503,0.4422,0.5185,0.4012,0.5336,0.3598,0.5487,0.3183,0.5643,0.2775,0.5813,0.2385,0.6005,0.2028,0.6223,0.1724,0.6466,0.1487,0.6727,0.1316,0.6997,0.12,0.7271,0.1124,0.7547,0.107,0.7824,0.1028,0.8101,0.0993,0.8378,0.0968,0.8656,0.0955,0.8934,0.0951,0.9211,0.0954,0.9489,0.096,0.9767,0.097,1.0045,0.098,1.0322,0.0991,1.06,0.1]);
      gl.uniform4fv(gl.getUniformLocation(prog, "uPath"), path);

      const uRes = gl.getUniformLocation(prog, "iResolution");
      const uOff = gl.getUniformLocation(prog, "uViewOffset");
      const uTime = gl.getUniformLocation(prog, "iTime");
      let t = 36.1207, prev = null;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");

      const frame = now => {
        if (document.hidden) { prev = null; return requestAnimationFrame(frame); }
        if (prev !== null && !reduced.matches) t = (t + Math.min(now - prev, 250) / 1000 * 0.25) % 60;
        prev = now;
        const maxDpr = innerWidth < 640 ? 1.25 : 1.75;
        const dpr = Math.min(devicePixelRatio || 1, maxDpr);
        const w = Math.max(1, Math.round(host.clientWidth * dpr)), h = Math.max(1, Math.round(host.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
        const vw = Math.max(w, h * 1.777778), vh = vw / 1.777778;
        gl.uniform3f(uRes, vw, vh, 1);
        gl.uniform2f(uOff, 2 * Math.round((vw - w) / 4), 2 * Math.round((vh - h) / 4));
        gl.uniform1f(uTime, ((t / 60 + 0.31) % 1) * 20 * Math.PI);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    })();
  </script>
</body>
